<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personalized webpage</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <section id="form-section">
        <h2 class="heading">Tell us about yourself</h2>

        <form id="user-form" class="content">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Your Name">
            <br>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter Your Age" min="1" max="120" required>


            <button type="submit" class="button">submit message</button>
        </form>

    </section>


    <!-- HIDDEN SECTION -->
    <div id="section-hidden" hidden>
        <h2 id="greetings"></h2>
        <p id="ageMonths"></p>
        <p id="ageMessage"></p>

        <h3>Daily Motivation</h3>
        <p id="quotes"></p>
        <button type="button" id="Edit-button">Edit My Details</button>

    </div>
</body>

</html>
